kind = "web"
previewPath = "/"
title = "BDM Website"
version = "1.0.0"
id = "artifacts/bdm-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22530

[services.development]
run = "pnpm --filter @workspace/bdm-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bdm-website", "run", "build" ]
publicDir = "artifacts/bdm-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22530"
BASE_PATH = "/"
